name: DevSecOps & Security Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 4 * * 1' # Weekly Monday security audit at 04:00 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  secrets-scan:
    name: Secrets Detection (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Gitleaks (pinned release, checksum-verified)
        run: |
          GITLEAKS_VERSION="8.24.0"
          GITLEAKS_SHA256="cb49b7de5ee986510fe8666ca0273a6cc15eb82571f2f14832c9e8920751f3a4"
          curl -sSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Run Gitleaks Scan
        run: gitleaks detect --source . --config .gitleaks.toml --verbose --redact

  zizmor:
    name: Workflow Security Analysis (Zizmor)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run zizmor
        run: |
          pipx run zizmor --format=sarif . > zizmor.sarif

      - name: Upload zizmor SARIF report
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: zizmor.sarif
          category: zizmor

  sca:
    name: Software Composition Analysis (SCA & Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js runtime
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Run npm audit check
        run: npm audit --audit-level=high

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin

      - name: Run Trivy vulnerability scanner (Repository Filesystem)
        run: |
          trivy fs --format sarif --output trivy-fs.sarif --severity CRITICAL,HIGH .

      - name: Upload Trivy SARIF report
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-fs.sarif'
          category: 'trivy-fs'

  sast-semgrep:
    name: Static Application Security Testing (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run Semgrep SAST Scan
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" -w /src semgrep/semgrep semgrep scan --sarif --output=semgrep.sarif --config=p/security-audit --config=p/secrets --config=p/javascript --config=p/typescript --config=p/owasp-top-ten

      - name: Upload Semgrep SARIF report
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  dast-zap:
    name: Dynamic Application Security Testing (OWASP ZAP)
    runs-on: ubuntu-latest
    needs: [sca]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Docker Container
        run: docker build -t walfa-labs-frontend:test .

      - name: Run Application Container for DAST
        run: |
          docker run -d --name test-app -p 3000:3000 walfa-labs-frontend:test
          # Wait for container health check
          sleep 5
          curl -I --retry 5 --retry-delay 2 http://localhost:3000/ || exit 1

      - name: Run OWASP ZAP Baseline DAST Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'http://localhost:3000'
          rules_file_name: '.zap/rules.tsv'
          allow_issue_writing: false
          fail_action: false

      - name: Stop Test Container
        if: always()
        run: docker rm -f test-app || true
