services:
  frontend-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: walfa-labs-frontend-dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - HOST=0.0.0.0
      - PORT=3000
      - NUXT_PUBLIC_API_BASE=${NUXT_PUBLIC_API_BASE:-http://localhost:8080/api/v1}
      - NUXT_PUBLIC_SITE_URL=${NUXT_PUBLIC_SITE_URL:-http://localhost:3000}
      - NUXT_PUBLIC_SITE_NAME=${NUXT_PUBLIC_SITE_NAME:-Walfa Labs}
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.nuxt
      - /app/.output
    security_opt:
      - no-new-privileges:true
